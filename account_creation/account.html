<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NNPKGM Enterprise — Create Account</title>
    <style>
        body {
            font-family: Consolas, monospace;
            background: #fafafa;
            color: #222;
            padding: 40px;
            max-width: 500px;
            margin: auto;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-family: inherit;
            font-size: 16px;
        }
        button {
            background: #222;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #444;
        }
        .note {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }
        .providers {
            margin-top: 20px;
        }
        .providers button {
            background: #eee;
            color: #222;
        }
    </style>
</head>
<body>

<h1>Create NNPKGM Enterprise Account</h1>

<p>Sign in using a supported identity provider:</p>

<div class="providers">
    <button>Sign in with GitHub</button>
    <button>Sign in with Microsoft</button>
    <button>Sign in with Google</button>
</div>

<p class="note">
NNPKGM Enterprise requires a verified identity to publish packages.
Local NNPKGM usage does not require an account.
</p>

</body>
</html>
